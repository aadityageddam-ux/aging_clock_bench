name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install "poetry==2.4.1"

      - name: Install dependencies (no dev/docs)
        run: poetry install --without dev,docs

      - name: Run tests
        run: |
          pip install pytest pytest-cov
          poetry run pytest tests/ -v

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        run: |
          if [ -z "${{ secrets.AGING_CLOCK_BENCH }}" ]; then
            echo "AGING_CLOCK_BENCH token not set. Skipping publish."
            exit 1
          fi
          poetry config pypi-token.pypi ${{ secrets.AGING_CLOCK_BENCH }}
          poetry publish
